name: 'actions/checkout'
description: 'actions/checkout with better defaults'
runs:
  using: "composite"
  steps:
    - run: git config --global core.autocrlf false
      shell: bash
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
